<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자기소개서</title>
    <!-- 이미지 저장을 위한 html2canvas 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --doc-bg: #ffffff;
            --text-color: #000000;
            --line-color: #000000;
            --header-bg: #e6e8eb;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px 10px;
            color: var(--text-color);
        }
        #captureArea {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--doc-bg);
            border: 2px solid var(--line-color);
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .header {
            background-color: var(--header-bg);
            padding: 20px;
            text-align: right;
            border-bottom: 1px solid transparent; /* 구조적 안정성 */
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }
        .content {
            padding: 10px 20px 30px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section h2 {
            font-size: 18px;
            margin: 0 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--line-color);
        }
        textarea {
            width: 100%;
            min-height: 120px;
            border: none;
            outline: none;
            resize: vertical;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.6;
            padding: 5px;
            box-sizing: border-box;
            background: transparent;
        }
        /* 입력 시 배경색이 변하지 않도록 처리 */
        textarea:focus {
            background-color: #fafbfc;
            border-radius: 4px;
        }
        
        .footer {
            margin: 20px 20px;
            padding-top: 15px;
            border-top: 1px solid #999;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #333;
        }
        .declaration {
            margin-bottom: 10px;
        }
        .date-sign {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .date-sign input {
            border: none;
            border-bottom: 1px solid #666;
            background: transparent;
            text-align: center;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .input-year { width: 40px; }
        .input-month, .input-day { width: 25px; }
        .input-name { width: 70px; }
        
        .btn-container {
            text-align: center;
            margin: 25px 0;
        }
        .save-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: background-color 0.2s, transform 0.1s;
        }
        .save-btn:active {
            background-color: #1a252f;
            transform: scale(0.98);
        }

        /* 모바일 최적화 미디어 쿼리 */
        @media (max-width: 480px) {
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .date-sign {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div id="captureArea">
        <div class="header">
            <h1>자기소개서</h1>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>성장과정</h2>
                <textarea placeholder="내용을 입력하세요"></textarea>
            </div>
            
            <div class="section">
                <h2>지원동기</h2>
                <textarea placeholder="내용을 입력하세요"></textarea>
            </div>
            
            <div class="section">
                <h2>사회경험 및 활동</h2>
                <textarea placeholder="내용을 입력하세요"></textarea>
            </div>
            
            <div class="section">
                <h2>입사 후 포부</h2>
                <textarea placeholder="내용을 입력하세요"></textarea>
            </div>
        </div>

        <div class="footer">
            <div class="declaration">위 모든 기재사항은 사실과 다름 없음을 확인합니다.</div>
            <div class="date-sign">
                20 <input type="text" class="input-year" maxlength="2"> 년 
                <input type="text" class="input-month" maxlength="2"> 월 
                <input type="text" class="input-day" maxlength="2"> 일 
                <span style="margin-left: 10px;">작성자 :</span> 
                <input type="text" class="input-name">
            </div>
        </div>
    </div>

    <!-- 이미지 저장 버튼 -->
    <div class="btn-container">
        <button class="save-btn" onclick="saveAsImage()">📷 현재 화면 이미지로 저장하기</button>
    </div>

    <script>
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // 모든 textarea에 자동 크기 조절 이벤트 추가
        document.querySelectorAll('textarea').forEach(el => {
            el.addEventListener('input', function() {
                autoResize(this);
            });
        });

        function saveAsImage() {
            const btn = document.querySelector('.save-btn');
            const originalText = btn.innerText;
            btn.innerText = '저장 중...';
            btn.disabled = true;

            const captureDiv = document.getElementById('captureArea');

            // 캡처 전 텍스트에어리어 배경색 제거 (포커스 시 배경색 변경 방지)
            document.querySelectorAll('textarea').forEach(el => el.blur());

            html2canvas(captureDiv, {
                scale: 2, // 고해상도 저장
                backgroundColor: '#ffffff'
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = '자기소개서_작성본.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                btn.innerText = originalText;
                btn.disabled = false;
            }).catch(err => {
                alert('이미지 저장 중 오류가 발생했습니다.');
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
